<link rel="stylesheet" href="/moneyball-courtside.css">

    <span class="courtside-scene" aria-hidden="true"><img data-shot="make" src="/moneyball-courtside.png" width="576" height="512" alt="" decoding="async"><img data-shot="miss" src="/moneyball-courtside-miss.png" width="576" height="512" alt="" decoding="async" hidden></span>
    <span class="courtside-copy"><span id="courtside-label">Take a shot</span><span id="courtside-odds">10% chance to make it</span><span id="courtside-status" role="status" aria-live="polite">Just for fun</span></span>
  </button>
</aside>
